
name: Playwright Tests and Reports Deployment

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        run: npx playwright test

      - name: Generate UI Allure Report
        if: always()
        run: |
          if [ -d allure-results ] && [ "$(ls -A allure-results)" ]; then
            npx allure generate allure-results --clean -o allure-report
          fi

      - name: Create API Report Directories
        run: |
          mkdir -p api-report api-allure-results

      - name: Run API Tests and Generate Reports
        if: always()
        run: |
          npx newman run "./api-tests/Demo Web Shop API Tests.postman_collection.json" \
            -r cli,htmlextra,allure \
            --reporter-htmlextra-export "./api-report/index.html" \
            --reporter-allure-resultsDir "./api-allure-results"

      - name: Generate API Allure Report
        if: always()
        run: |
          if [ -d api-allure-results ] && [ "$(ls -A api-allure-results)" ]; then
            npx allure generate api-allure-results --clean -o api-allure-report
          fi

      - name: Prepare GitHub Pages Site
        if: always()
        run: |
          mkdir -p site/api-report site/api-allure-report

          if [ -d allure-report ]; then
            cp -r allure-report/. site/
          fi

          if [ -d api-report ]; then
            cp -r api-report/. site/api-report/
          fi

          if [ -d api-allure-report ]; then
            cp -r api-allure-report/. site/api-allure-report/
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-site
          path: site/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pages-site
          path: site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
